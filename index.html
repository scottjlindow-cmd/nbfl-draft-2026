<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBFL 2026 Season XV Draft War Room</title>
<style>
  :root {
    --bg-dark: #121824;
    --card-bg: #1c2536;
    --accent: #e5a93c;
    --accent-blue: #3b82f6;
    --text-light: #f8fafc;
    --text-dim: #94a3b8;
    --border: #334155;
    --danger: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg-dark); color: var(--text-light); padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 14px; }
  .card h2 { font-size: 1.1rem; margin-bottom: 10px; color: var(--accent-blue); display: flex; justify-content: space-between; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  input, select, button { padding: 8px 12px; border-radius: 4px; border: 1px solid var(--border); background: #0f172a; color: white; }
  input[type="text"] { flex-grow: 1; }
  button { background: var(--accent-blue); cursor: pointer; font-weight: bold; border: none; }
  button:hover { opacity: 0.9; }
  button.danger { background: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #0f172a; color: var(--text-dim); }
  tr:hover { background: #26334d; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
  .badge-qb { background: #be185d; }
  .badge-rb { background: #047857; }
  .badge-rec { background: #b45309; }
  .badge-k { background: #6d28d9; }
  .badge-dst { background: #475569; }
  .roster-slot { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .roster-slot span { font-size: 0.9rem; }
  .stats-banner { display: flex; gap: 12px; font-size: 0.9rem; margin-bottom: 12px; background: #0f172a; padding: 8px; border-radius: 4px; }
  .stats-banner span { color: var(--accent); font-weight: bold; }
  .drafted { text-decoration: line-through; opacity: 0.4; }
</style>
</head>
<body>

<header>
  <div>
    <h1>NBFL 2026 Draft War Room</h1>
    <small style="color: var(--text-dim)">Stump Lake Peckers Dashboard</small>
  </div>
  <div class="stats-banner">
    <div>Total Spent: $<span id="totalSpent">0.00</span></div>
    <div>Roster Spots: <span id="rosterCount">0</span>/12</div>
  </div>
</header>

<div class="grid">
  <!-- Left Column: Master Player Board -->
  <div class="card">
    <h2>Player Pool Database</h2>
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search player or team..." onkeyup="renderPlayers()">
      <select id="posFilter" onchange="renderPlayers()">
        <option value="ALL">All Positions</option>
        <option value="QB">QB</option>
        <option value="RB">RB</option>
        <option value="REC">REC</option>
        <option value="K">K</option>
        <option value="D/ST">D/ST</option>
      </select>
    </div>
    <div style="max-height: 600px; overflow-y: auto;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Pos</th>
            <th>NFL Team</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="playerTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Right Column: My Roster & Auction Entry -->
  <div class="card">
    <h2>Stump Lake Peckers Roster</h2>
    <div id="rosterList"></div>
    
    <hr style="border: 0; border-top: 1px solid var(--border); margin: 16px 0;">
    
    <h2>Quick Add Custom / Off-Board Player</h2>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;">
      <input type="text" id="customName" placeholder="Player Name" style="flex: 2;">
      <select id="customPos" style="flex: 1;">
        <option value="QB">QB</option>
        <option value="RB">RB</option>
        <option value="REC">REC</option>
        <option value="K">K</option>
        <option value="D/ST">D/ST</option>
      </select>
      <input type="text" id="customTeam" placeholder="NFL Team" style="flex: 1;">
      <input type="number" id="customCost" placeholder="$ Price" step="0.5" style="width: 80px;">
      <button onclick="addCustomPlayer()">Draft</button>
    </div>
  </div>
</div>

let draftedState = {};

function renderPlayers() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filter = document.getElementById('posFilter').value;
  const tbody = document.getElementById('playerTableBody');
  tbody.innerHTML = '';

  players.forEach((p, idx) => {
    if (filter !== 'ALL' && p.pos !== filter) return;
    if (query && !p.name.toLowerCase().includes(query) && !p.team.toLowerCase().includes(query)) return;

    const tr = document.createElement('tr');
    if (isDrafted) tr.className = 'drafted';

    tr.innerHTML = `
      <td>${p.id}</td>
      <td><strong>${p.name}</strong></td>
      <td><span class="badge badge-${p.pos.toLowerCase().replace('/','')}">${p.pos}</span></td>
      <td>${p.team}</td>
      <td>
        ${!isDrafted ? `
          <button style="padding: 3px 8px; font-size: 0.75rem;" onclick="promptDraft(${p.id})">+ Mine</button>
          <button style="padding: 3px 8px; font-size: 0.75rem; background:#475569;" onclick="markOffBoard(${p.id})">Off</button>
        ` : `<button class="danger" style="padding: 3px 8px; font-size: 0.75rem;" onclick="unmarkDraft(${p.id})">Undo</button>`}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function promptDraft(id) {
  const p = players.find(x => x.id === id);
  let cost = prompt(`Enter winning bid for ${p.name} ($0.50 minimum, or 0 for Snake pick):`, "1.00");
  if (cost === null) return;
  cost = parseFloat(cost) || 0;
  
  draftedState[id] = { byMe: true, cost: cost };
  myRoster.push({ ...p, cost: cost });
  updateUI();
}

function markOffBoard(id) {
  draftedState[id] = { byMe: false, cost: 0 };
  updateUI();
}

function unmarkDraft(id) {
  delete draftedState[id];
  myRoster = myRoster.filter(p => p.id !== id);
  updateUI();
}

function addCustomPlayer() {
  const name = document.getElementById('customName').value.trim();
  const pos = document.getElementById('customPos').value;
  const team = document.getElementById('customTeam').value.trim() || 'FA';
  const cost = parseFloat(document.getElementById('customCost').value) || 0.50;

  if (!name) return alert('Enter player name');
  const customObj = { id: Date.now(), name, pos, team, cost };
  myRoster.push(customObj);
  document.getElementById('customName').value = '';
  document.getElementById('customTeam').value = '';
  document.getElementById('customCost').value = '';
  updateUI();
}

function removeRosterIndex(idx) {
  const item = myRoster[idx];
  if (item.id && draftedState[item.id]) {
    delete draftedState[item.id];
  }
  myRoster.splice(idx, 1);
  updateUI();
}

function updateUI() {
  renderPlayers();
  renderRoster();
}

function renderRoster() {
  const rosterDiv = document.getElementById('rosterList');
  rosterDiv.innerHTML = '';
  let totalCost = 0;

  const slots = [
    { label: "KICKER (Snake)", match: p => p.pos === 'K' },
    { label: "DSP / DEF (Snake)", match: p => p.pos === 'D/ST' },
    { label: "QB", match: p => p.pos === 'QB' },
    { label: "RB 1", match: p => p.pos === 'RB' },
    { label: "RB 2", match: p => p.pos === 'RB' },
    { label: "REC 1", match: p => p.pos === 'REC' },
    { label: "REC 2", match: p => p.pos === 'REC' },
    { label: "REC 3", match: p => p.pos === 'REC' },
    { label: "MISC 1", match: () => true },
    { label: "MISC 2", match: () => true },
    { label: "MISC 3", match: () => true },
    { label: "MISC 4", match: () => true }
  ];

  let assigned = new Set();

  slots.forEach((slot, sIdx) => {
    let assignedPlayer = null;
    let assignedRealIdx = -1;

    for (let i = 0; i < myRoster.length; i++) {
      if (!assigned.has(i) && slot.match(myRoster[i])) {
        assignedPlayer = myRoster[i];
        assignedRealIdx = i;
        assigned.add(i);
        break;
      }
    }

    const row = document.createElement('div');
    row.className = 'roster-slot';

    if (assignedPlayer) {
      totalCost += assignedPlayer.cost;
      row.innerHTML = `
        <span><strong>${slot.label}:</strong> ${assignedPlayer.name} (${assignedPlayer.team}) - $${assignedPlayer.cost.toFixed(2)}</span>
        <button class="danger" style="padding: 2px 6px; font-size: 0.7rem;" onclick="removeRosterIndex(${assignedRealIdx})">X</button>
      `;
    } else {
      row.innerHTML = `<span style="color: var(--text-dim)"><strong>${slot.label}:</strong> <em>[Empty]</em></span>`;
    }
    rosterDiv.appendChild(row);
  });

  document.getElementById('totalSpent').innerText = totalCost.toFixed(2);
  document.getElementById('rosterCount').innerText = myRoster.length;
}

updateUI();
</script>
</body>
</html>
